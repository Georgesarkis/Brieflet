# Copy to bench.yaml and edit. `python -m bench plan` shows the matrix + cost estimate and spends nothing.

repeats: 3                 # runs per question × arm × model (Claude's token use varies a lot run to run)
max_usd: 10                # hard stop for paid runners: `run` refuses if the estimate is above it, and stops mid-run
max_usd_per_run: 1.00      # one question run is cut off above this
results: results           # JSONL rows + reports go here

repos:
  eshop:
    path: ~/bench/repos/eShop          # a clean clone, checked out at `sha`
    sha: 3c6e531a6063676ece317644f72172fb42a935b3   # dotnet/eShop main, 26 Nov 2026
    questions: questions/eshop.yaml
    strip: [CLAUDE.md, AGENTS.md, AI_CONTEXT.md, DECISIONS.md, docs/architecture, docs/decisions]

# What each arm puts in the repo copy (after `strip`). {artifacts} = folder with generated docs per repo.
artifacts: ~/bench/artifacts
arms:
  none: {}
  graphify-ast:
    overlay: ["{artifacts}/{repo}/graphify-ast"]
    claude_md: "# Code map\n\nA code graph of this repo (Graphify) is in [docs/architecture/GRAPH_REPORT.md](docs/architecture/GRAPH_REPORT.md). Read it first to find where things are.\n"
  brieflet:
    overlay: ["{artifacts}/{repo}/brieflet"]       # AI_CONTEXT.md + CLAUDE.md + diagram + ADRs, no graph

# Which model answers. Compare arms within one model only.
models:
  - name: fake                         # offline stand-in: checks the whole pipeline, $0
    runner: fake
    model: fake
  # - name: my-reader                  # a plugin runner (entry point group brieflet.bench_runners)
  #   runner: <plugin name>
  #   model: <model id>
  #   billing: subscription            # only if a flat plan you already pay covers it; otherwise it's paid:
  #                                    # needs a price (prices: block below or the plugin's), --yes and max_usd

# judge:                               # quality 0-3 per answer; `bench judge` refuses without this block
#   runner: <plugin name>              # entry point group brieflet.bench_judges
#   model: <model id>

# prices:                              # USD per 1M tokens, per runner; overrides bench/prices.yaml + plugin prices
#   <plugin name>: {<model id>: {input: 1.25, output: 10.00, cache_read: 0.125, cache_write: 1.25}}

# Token guess per question run, used until real results exist (then `plan` uses measured medians instead).
# From the 22 Nov 2026 eshop-demo run (Sonnet, Claude Code): none 158k / 3 q, graph 343k / 3 q, docs 78k / 3 q.
prior_tokens:
  none: {input: 53000, output: 2000}
  graphify-ast: {input: 115000, output: 2000}
  brieflet: {input: 26000, output: 2000}
  default: {input: 80000, output: 2000}
